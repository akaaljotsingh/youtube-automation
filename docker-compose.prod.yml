services:
  api:
    build: .
    command: node dist/main.js
    env_file: [.env]
    ports: ["8080:8080"]
    depends_on: [postgres, redis]

  worker:
    build: .
    command: node dist/worker.js
    env_file: [.env]
    depends_on: [postgres, redis]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ytaf
    volumes: ["pg:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    volumes: ["redis:/data"]

volumes:
  pg:
  redis: